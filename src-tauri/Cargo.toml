[package]
name = "krill-files"
version = "0.1.0"
description = "A minimal file browser for Linux"
authors = ["Filip"]
edition = "2021"

[build-dependencies]
tauri-build = "2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2", features = [] }
tauri-plugin-cli = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
krill-desktop-core = { git = "https://github.com/krill-software/desktop-core", tag = "v0.2.0" }

[[bin]]
name = "krill-files"
path = "src/main.rs"

[lib]
name = "krill_files_lib"
path = "src/lib.rs"
